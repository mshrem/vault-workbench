name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check public file boundary
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          prohibited = [n for n in names if pathlib.PurePosixPath(n).suffix.lower() in {'.stl', '.glb', '.pdf'} or pathlib.PurePosixPath(n).name == '.env']
          if prohibited:
              raise SystemExit('Private/runtime files must not be tracked: ' + ', '.join(prohibited))
          PY
      - name: Install Python dependencies
        run: python -m pip install --only-binary=:all: -r requirements-importer.txt
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install Node development dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript syntax checks
        run: npm run check
      - name: JavaScript and DOM tests
        run: npm test
